  s:[`He is twenty centimetres tall and was put there in a single night by the Unknown Sculptor. The tree has meanwhile grown round his feet.`,`In 2020 he suddenly vanished, branch and all. Alarm across the city. It turned out the maker had collected him for a polish. He is back.`],
  tip:`Look up into the plane trees on the Stadhouderskade side. Whoever spots him first does not buy the drinks.`}},

{id:'rijks',lat:52.3600,lng:4.8852,c:'verhaal',z:'museum',t:1,a:'Onderdoorgang Rijksmuseum',
 nl:{n:`Fietsen door het Rijksmuseum`,k:`Dwars door het Rijksmuseum loopt een fietspad. Daar is meer dan een eeuw ruzie over geweest.`,
  s:[`Pierre Cuypers won in 1875 de prijsvraag voor het museum, mede dankzij de onderdoorgang: het gebouw moest ook een stadspoort zijn naar het nieuwe Zuid. Bijna elke directeur wilde de tunnel daarna dicht. Bij de grote verbouwing, die in 2013 klaar was, won de Fietsersbond. Het pad bleef.`,`Koning Willem III kwam niet naar de opening. Hij zou het gebouw te veel op een kerk vinden gelijken; Cuypers was een overtuigd katholiek. Binnen hangt de Nachtwacht, die in 1715 aan alle kanten werd ingekort om op het stadhuis tussen twee deuren te passen. Dat stadhuis is het Paleis op de Dam. De afgesneden stukken zijn nooit teruggevonden.`],
  tip:`Fiets er zelf doorheen, of blijf even staan: er speelt vaak een straatmuzikant en de akoestiek krijg je er gratis bij.`},
 en:{n:`Cycling through the Rijksmuseum`,k:`A cycle path runs straight through the Rijksmuseum. People have fought about it for over a century.`,
  s:[`Pierre Cuypers won the design competition in 1875 partly thanks to the passage: the building also had to be a city gate to the new south. Almost every director since wanted the tunnel closed. In the big renovation, finished in 2013, the cyclists' union won. The path stayed.`,`King William III skipped the opening. He reportedly found the building too much like a church; Cuypers was a devout Catholic. Inside hangs the Night Watch, which in 1715 was trimmed on all sides to fit between two doors at the town hall. That town hall is the Royal Palace on Dam Square. The missing strips were never found.`],
  tip:`Cycle through yourself, or stop and listen: there is often a busker, and the acoustics come free.`}},

{id:'badkuip',lat:52.3580,lng:4.8797,c:'bouw',z:'museum',a:'Museumplein 10',
 nl:{n:`De Badkuip`,k:`Amsterdam zette een gigantische witte badkuip tegen een museum uit 1895. De naam bleef meteen plakken.`,
  s:[`Het Stedelijk Museum kreeg in 2012 een nieuwe vleugel: een glad wit volume dat over het plein hangt. Binnen een dag heette het in de hele stad de Badkuip. De buitenkant is gemaakt van een kunststof die versterkt is met vezels zoals ze ook in kogelwerende vesten zitten.`,`Op het Museumplein zelf stond in 1883 een wereldtentoonstelling, met paviljoens uit alle koloniën. Daarna was het lang een rommelig terrein waar een weg dwars doorheen liep. Het grasveld zoals je het nu ziet is pas van de jaren negentig.`],
  tip:`Kijk van onderen tegen de overhang aan. Het is groter dan je denkt.`},
 en:{n:`The Bathtub`,k:`Amsterdam put a giant white bathtub against an 1895 museum. The nickname stuck at once.`,
  s:[`The Stedelijk Museum got a new wing in 2012: a smooth white volume hovering over the square. Within a day the whole city called it the Bathtub. Its skin is a composite reinforced with the kind of fibres used in bulletproof vests.`,`Museumplein itself hosted a world fair in 1883, with pavilions from all the colonies. After that it was long a scruffy site with a road running straight through. The lawn you see now only dates from the 1990s.`],
  tip:`Stand underneath the overhang and look up. It is bigger than you think.`}},

{id:'picasso',lat:52.3570,lng:4.8683,c:'grap',z:'museum',a:'Vondelpark, zuidkant',
 nl:{n:`De vis van Picasso`,k:`Picasso gaf Amsterdam een vogel. Amsterdam noemt hem de vis.`,
  s:[`Toen het Vondelpark in 1965 honderd jaar bestond, kwam er een grote beeldententoonstelling. Picasso schonk de stad dit werk, uit vriendschap met Willem Sandberg, de directeur van het Stedelijk. Picasso ontwierp het; de Noorse kunstenaar Carl Nesjar maakte het in beton vol zwarte steentjes en zandstraalde de lijnen erin.`,`Het heet officieel Figure découpée, een uitgeknipte figuur, en het stelt een vogel voor. Iedereen zegt de vis. In 2013 ging het even op reis naar de beeldenroute ArtZuid; daarna kwam het terug naar het park.`],
  tip:`Hij staat aan de zuidkant, ongeveer halverwege het park. Bekijk hem van opzij: hij is zo plat als een pannenkoek.`},
 en:{n:`Picasso's fish`,k:`Picasso gave Amsterdam a bird. Amsterdam calls it the fish.`,
  s:[`When the Vondelpark turned a hundred in 1965, there was a big sculpture show. Picasso gave the city this piece, out of friendship with Willem Sandberg, director of the Stedelijk. Picasso designed it; Norwegian artist Carl Nesjar cast it in concrete packed with black pebbles and sandblasted the lines in.`,`Its official name is Figure découpée, a cut-out figure, and it shows a bird. Everyone says the fish. In 2013 it went briefly on tour to the ArtZuid sculpture route, then came back to the park.`],
  tip:`It is on the south side, about halfway along the park. Look at it side-on: it is as flat as a pancake.`}},

{id:'theehuis',lat:52.3579,lng:4.8711,c:'eten',z:'museum',a:'Vondelpark 5',
 nl:{n:`Het Blauwe Theehuis`,k:`In 1937 landde er een vliegende schotel in het Vondelpark. Hij schenkt nu bier.`,
  s:[`In de zomer van 1936 brandde het oude theehuis op deze plek af. Architect Baanders zette er een jaar later iets heel anders neer: ringen van beton, staal en glas, rond als een ufo. Voor een negentiende-eeuws park was dat behoorlijk gedurfd. Nu is het een rijksmonument.`,`Tegenwoordig is het een proeflokaal van Brouwerij 't IJ. Dat is dezelfde brouwerij die naast de hoogste houten molen van Nederland zit, verderop in deze wandeling.`],
  tip:`Groot terras onder de bomen, met tafeltennis en jeu de boules.`},
 en:{n:`The Blue Tea House`,k:`In 1937 a flying saucer landed in the Vondelpark. It serves beer now.`,
  s:[`In the summer of 1936 the old tea house on this spot burned down. A year later architect Baanders built something completely different: rings of concrete, steel and glass, round as a UFO. For a nineteenth-century park that was quite daring. It is now a listed monument.`,`These days it is a taproom of Brouwerij 't IJ, the same brewery that sits beside the tallest wooden windmill in the country, elsewhere on this walk.`],
  tip:`A big terrace under the trees, with table tennis and pétanque.`}},

{id:'stadion',lat:52.3434,lng:4.8542,c:'verhaal',z:'museum',a:'Olympisch Stadion 2',
 nl:{n:`Het Olympisch Stadion`,k:`Het olympisch vuur is een Nederlandse uitvinding. Hier brandde het voor het eerst.`,
  s:[`Architect Jan Wils bedacht het voor de Spelen van 1928. Boven op de smalle Marathontoren naast het stadion stond een schaal: overdag kringelde er rook uit, 's avonds vuur, omdat je dat in het donker beter zag. Elke vlam bij elke Spelen sindsdien gaat terug op dit idee.`,`Twee jaar eerder stonden hier nog koeien in de wei. En de Spelen gingen bijna niet door: in 1925 weigerde de Tweede Kamer geld te geven. Een landelijke inzameling onder sportliefhebbers redde de zaak.`],
  tip:`Een flink stuk buiten de rest: pak de fiets of de tram. Zoek de Marathontoren aan de voorkant.`},
 en:{n:`The Olympic Stadium`,k:`The Olympic flame is a Dutch invention. It burned here for the first time.`,
  s:[`Architect Jan Wils came up with it for the 1928 Games. On top of the slender Marathon Tower beside the stadium sat a bowl: smoke curled from it by day and fire by night, because fire shows up better in the dark. Every Olympic flame since goes back to this idea.`,`Two years earlier there were cows grazing here. And the Games almost did not happen: in 1925 parliament refused to pay. A nationwide collection among sports fans saved the day.`],
  tip:`Well away from the rest: take a bike or tram. Look for the Marathon Tower at the front.`}},

{id:'albertcuyp',lat:52.3557,lng:4.8930,c:'shop',z:'pijp',a:'Albert Cuypstraat',
 nl:{n:`De Albert Cuyp en een plein met een trucje`,k:`De drukste markt van het land is genoemd naar een schilder uit Dordrecht.`,
  s:[`Aelbert Cuyp werd geboren in Dordrecht, stierf in Dordrecht en schilderde vooral koeien bij de rivier. De straten in De Pijp kregen namen van schilders uit de Gouden Eeuw, waar ze ook vandaan kwamen. Deze straat is breder dan de rest, omdat hier vroeger een sloot liep.`,`Om de hoek ligt het Marie Heinekenplein. Het moest naar een schilder heten en een straatnaam mag niet naar een bedrijf verwijzen. De oplossing: Marie Heineken, schilder van bloemstillevens en nicht van de oprichter van de brouwerij. Zo kreeg Heineken toch een plein.`],
  tip:`Zes dagen per week markt, niet op zondag. Neem een verse stroopwafel.`},
 en:{n:`The Albert Cuyp and a square with a trick`,k:`The busiest street market in the country is named after a painter from Dordrecht.`,
  s:[`Aelbert Cuyp was born in Dordrecht, died in Dordrecht and mostly painted cows by the river. The streets of De Pijp were named after Golden Age painters, wherever they came from. This street is wider than the rest because a ditch once ran here.`,`Round the corner is Marie Heinekenplein. It had to be named after a painter, and a street name may not refer to a company. The solution: Marie Heineken, painter of flower still lifes and niece of the brewery's founder. So Heineken got its square after all.`],
  tip:`Market six days a week, not on Sundays. Get a fresh stroopwafel.`}},

{id:'gooyer',lat:52.3667,lng:4.9261,c:'eten',z:'oost',a:'Funenkade 7',
 nl:{n:`Molen De Gooyer en Brouwerij 't IJ`,k:`De hoogste houten molen van Nederland, met een brouwerij aan zijn voeten.`,
  s:[`De Gooyer is 26,6 meter hoog. Hij is de laatste van een rij korenmolens die eeuwenlang op de bolwerken langs de stadsrand stonden. Hij is een paar keer verhuisd; hier staat hij sinds 1814.`,`Ernaast, in het oude gemeentelijke badhuis uit 1911, brouwt Brouwerij 't IJ sinds 1985. Waar Amsterdammers vroeger kwamen om zich te wassen, komen ze nu voor een biertje. De molen doet niets voor de brouwerij, behalve poseren op het etiket.`],
  tip:`De molen zelf kun je niet in. Het terras wel.`},
 en:{n:`De Gooyer windmill and Brouwerij 't IJ`,k:`The tallest wooden windmill in the Netherlands, with a brewery at its feet.`,
  s:[`De Gooyer is 26.6 metres tall. It is the last of a row of corn mills that stood for centuries on the bastions along the edge of town. It has moved a few times; it has stood here since 1814.`,`Next door, in the old municipal bathhouse from 1911, Brouwerij 't IJ has brewed since 1985. Where Amsterdammers once came to wash, they now come for a beer. The mill does nothing for the brewery except pose on the label.`],
  tip:`You cannot go inside the mill. The terrace, yes.`}},

{id:'hortus',lat:52.3667,lng:4.9081,c:'rust',z:'oost',a:'Plantage Middenlaan 2a',
 nl:{n:`De Hortus en de koffie van de Franse koning`,k:`Een koffieplant uit deze tuin ging als relatiegeschenk naar Lodewijk XIV.`,
  s:[`De Hortus begon in 1638 als kruidentuin voor artsen en apothekers, want medicijnen kwamen toen uit planten. Hij hoort bij de oudste botanische tuinen ter wereld. In 1987 ging hij bijna failliet; een groep liefhebbers hield hem open.`,`In 1706 kwamen hier koffieplanten aan uit Java. Een paar jaar later nam burgemeester Pancras er een mee naar Frankrijk, als cadeau voor Lodewijk XIV. Volgens de koffiegeschiedenis ging de koffie vanuit de Franse kassen naar de Caraïben en Zuid-Amerika.`],
  tip:`De koffieplanten staan in de Drieklimatenkas. Het oranjerie-café is een fijne plek om te zitten.`},
 en:{n:`The Hortus and the French king's coffee`,k:`A coffee plant from this garden went to Louis XIV as a diplomatic gift.`,
  s:[`The Hortus started in 1638 as a herb garden for doctors and apothecaries, since medicine then came from plants. It is among the oldest botanical gardens in the world. In 1987 it almost went bankrupt; a group of enthusiasts kept it open.`,`In 1706 coffee plants arrived here from Java. A few years later mayor Pancras took one to France as a present for Louis XIV. According to coffee history, coffee travelled from the French hothouses to the Caribbean and South America.`],
  tip:`The coffee plants are in the Three Climates Greenhouse. The orangery café is a lovely place to sit.`}},

{id:'magere',lat:52.3634,lng:4.9023,c:'verhaal',z:'zuid',a:'Amstel, bij de Kerkstraat',
 nl:{n:`De Magere Brug`,k:`Twee zussen woonden aan weerskanten van de Amstel en wilden elkaar elke dag zien. Tenminste, dat zegt de legende.`,
  s:[`Het verhaal: de gezusters Mager lieten een brug bouwen zodat ze niet steeds om hoefden te lopen. Waarschijnlijker is dat de brug zo heet omdat hij gewoon smal was, mager dus. De brug is sindsdien een paar keer vervangen en breder geworden; de bijnaam bleef.`,`Het is een dubbele ophaalbrug, zoals je ze op schilderijen ziet, en hij gaat nog steeds open voor boten. In het donker branden er honderden lampjes langs de balken.`],
  tip:`Kom na zonsondergang. Ga aan de overkant op de kade staan voor de foto.`},
 en:{n:`The Skinny Bridge`,k:`Two sisters lived on opposite banks of the Amstel and wanted to see each other daily. So the legend goes.`,
  s:[`The story: the Mager sisters had a bridge built so they did not have to walk round. More likely the bridge got its name simply because it was narrow: mager means skinny. It has been replaced a few times since and grown wider; the nickname stayed.`,`It is a double drawbridge like the ones in paintings, and it still opens for boats. After dark hundreds of little lights glow along its beams.`],
  tip:`Come after sunset. Stand on the opposite quay for the photo.`}},

{id:'schip',lat:52.3903,lng:4.8735,c:'bouw',z:'noord',a:'Oostzaanstraat 45',
 nl:{n:`Het Schip`,k:`Een paleis voor arbeiders, met een eigen postkantoor in de boeg.`,
  s:[`Michel de Klerk bouwde dit blok tussen 1917 en 1921 voor woningbouwvereniging Eigen Haard: ruim honderd arbeiderswoningen en een postkantoor, om een bestaande school heen. Door de vorm heette het al snel Het Schip. Zijn motto: niets is mooi genoeg voor de arbeider. Kijk naar de ronde hoeken, de verticaal gemetselde stenen en de ladderramen.`,`Wie hier introk, kwam vaak uit een kelderwoning zonder ramen en zonder wc. In het postkantoor haalden de bewoners hun loon op. De Klerk stierf in 1923, op zijn negenendertigste.`],
  tip:`Loop er helemaal omheen: elke kant is anders. Het museum laat ook een ingerichte arbeiderswoning zien.`},
 en:{n:`Het Schip (The Ship)`,k:`A palace for workers, with its own post office in the bow.`,
  s:[`Michel de Klerk built this block between 1917 and 1921 for the Eigen Haard housing association: about a hundred workers' homes and a post office, wrapped round an existing school. Its shape soon earned it the name The Ship. His motto: nothing is too beautiful for the worker. Look at the rounded corners, the vertically laid bricks and the ladder windows.`,`Many who moved in came from cellar homes with no windows and no toilet. Residents collected their wages at the post office. De Klerk died in 1923, aged thirty-nine.`],
  tip:`Walk all the way round: every side is different. The museum also shows a furnished worker's flat.`}},

{id:'adam',lat:52.3842,lng:4.9020,c:'grap',z:'noord',a:'Overhoeksplein 5',
 nl:{n:`Schommelen boven het IJ`,k:`Op honderd meter hoogte schommel je over de rand van een toren.`,
  s:[`Boven op de A'DAM Toren, recht tegenover het Centraal Station, hangt Over The Edge. De schommel ging in 2016 open en heet de hoogste van Europa. Je zwaait heen en weer over de rand, met Amsterdam onder je voeten.`,`De toren was vroeger een kantoor van Shell. Nu zitten er een hotel, een draaiend restaurant en clubs in. Ook zonder schommel is het uitzicht over de stad en het IJ de oversteek waard.`],
  tip:`De pont achter het Centraal Station is gratis en vaart om de paar minuten. Schommelen kost extra.`},
 en:{n:`Swinging above the IJ`,k:`A hundred metres up, you swing out over the edge of a tower.`,
  s:[`On top of the A'DAM Tower, right across from Central Station, hangs Over The Edge. The swing opened in 2016 and is billed as the highest in Europe. You sway back and forth over the edge with Amsterdam beneath your feet.`,`The tower used to be an office of Shell. Today it holds a hotel, a revolving restaurant and clubs. Even without the swing, the view over the city and the IJ is worth the crossing.`],
  tip:`The ferry behind Central Station is free and leaves every few minutes. The swing costs extra.`}},

{id:'westergas',lat:52.3858,lng:4.8752,c:'rust',z:'noord',a:'Klönneplein',
 nl:{n:`De Westergasfabriek`,k:`Hier werd het gas gemaakt voor de lantaarns van de stad. Nu zit je er op een terras.`,
  s:[`Eind negentiende eeuw kookte deze fabriek steenkool tot lichtgas, dat via buizen naar de straatlantaarns en huizen ging. Toen aardgas kwam, was het voorbij. Wat achterbleef was een terrein met een flink vervuilde bodem.`,`Na een grote schoonmaak werd het een park met evenementen. In de oude gashouder, de ketelhuizen en de zuiveringshal zitten nu bioscoopjes, restaurants en zalen. De gebouwen zelf zijn gebleven, in rode baksteen met torentjes.`],
  tip:`Het Westerpark ligt er direct naast. Op zondag is er geregeld een markt.`},
 en:{n:`The Westergasfabriek`,k:`This is where gas was made for the city's street lamps. Now you sit here on a terrace.`,
  s:[`In the late nineteenth century this factory baked coal into town gas, which ran through pipes to street lamps and homes. When natural gas came, it was over. What remained was a site with badly polluted soil.`,`After a big clean-up it became a park with events. The old gasholder, boiler houses and purification hall now hold small cinemas, restaurants and venues. The buildings themselves stayed, in red brick with little towers.`],
  tip:`Westerpark is right next door. There is often a market on Sundays.`}},

{id:'zandhoek',lat:52.3878,lng:4.8880,c:'rust',z:'noord',a:'Zandhoek, Realeneiland',
 nl:{n:`De Westelijke Eilanden`,k:`Vijf minuten van het Centraal Station ligt een dorp van ophaalbruggen, werfjes en pakhuizen. Bijna niemand loopt er.`,
  s:[`Rond 1610–1615 werden hier drie eilanden opgespoten als uitbreiding van de haven: Bickerseiland, Prinseneiland en Realeneiland. Er kwamen scheepswerven, teerkokerijen en pakhuizen. Toen de schepen te groot werden, verhuisde de haven naar het oosten en raakte de buurt in verval.`,`Langs de Zandhoek werd zand opgeslagen. Dat ging als ballast in de schepen en werd ook gebruikt om de straten in de stad op te hogen. De rij huizen aan het water is nu een van de mooiste plekjes van de stad, en filmploegen weten dat ook.`],
  tip:`Loop het rondje over de witte ophaalbruggen. Het Prinseneiland is het stilst.`},
 en:{n:`The Western Islands`,k:`Five minutes from Central Station lies a village of drawbridges, boatyards and warehouses. Hardly anyone walks here.`,
  s:[`Around 1610–1615 three islands were built up here to extend the harbour: Bickerseiland, Prinseneiland and Realeneiland. Shipyards, tar works and warehouses followed. When ships grew too big, the harbour moved east and the area fell into decay.`,`Sand was stored along the Zandhoek. It went into ships as ballast and was also used to raise the streets of the city. The row of houses by the water is now one of the prettiest corners of town, as film crews know.`],
  tip:`Walk the loop over the white drawbridges. Prinseneiland is the quietest.`}},

{id:'eye',lat:52.3843,lng:4.9007,c:'bouw',z:'noord',a:'IJpromenade 1',
 nl:{n:`Eye, aan de overkant`,k:`Een wit filmmuseum dat eruitziet alsof het elk moment kan opstijgen. De boot ernaartoe is gratis.`,
  s:[`Eye Filmmuseum opende in 2012 aan de overkant van het IJ, op het oude Shell-terrein. Het gebouw heeft schuine witte vlakken en ziet er vanaf elke kant anders uit. Binnen zijn zalen, een tentoonstelling en een groot terras op het water.`,`De oversteek zelf hoort erbij: de pont achter het Centraal Station vaart de hele dag en kost niets. Je staat tussen fietsers, scooters en toeristen, en na vijf minuten sta je in Noord.`],
  tip:`Neem een drankje op het terras en kijk terug naar het station. Dat is het mooiste uitzicht op het centrum.`},
 en:{n:`Eye, across the water`,k:`A white film museum that looks ready to take off. The boat there is free.`,
  s:[`Eye Filmmuseum opened in 2012 across the IJ, on the old Shell site. The building is all slanting white planes and looks different from every side. Inside are cinemas, an exhibition and a big terrace on the water.`,`The crossing is part of the fun: the ferry behind Central Station runs all day and costs nothing. You stand among bikes, scooters and tourists, and five minutes later you are in Noord.`],
  tip:`Have a drink on the terrace and look back at the station. It is the best view of the centre.`}},

{id:'zeemagazijn',lat:52.3717,lng:4.9150,c:'verhaal',z:'oost',a:'Kattenburgerplein 1',
 nl:{n:`Het Scheepvaartmuseum en het VOC-schip`,k:`Aan de kade ligt de Amsterdam, een nagebouwd VOC-schip. Het origineel liep op zijn eerste reis vast bij Engeland.`,
  s:[`Het museum zit in 's Lands Zeemagazijn uit 1656, het pakhuis van de marine. Hier lagen zeilen, touw, kanonnen en voorraden voor de oorlogsvloot. De binnenplaats heeft nu een glazen dak met een patroon van windrozen en kompaslijnen.`,`Het echte schip Amsterdam liep in 1749 op zijn eerste reis vast bij Hastings. Het wrak ligt daar nog steeds in het zand. De kopie aan de kade is in de jaren tachtig nagebouwd, door vrijwilligers en jongeren in een werkproject.`],
  tip:`Ook zonder kaartje is de kade de moeite: je ziet het schip van dichtbij.`},
 en:{n:`The Maritime Museum and the VOC ship`,k:`Moored at the quay is the Amsterdam, a replica East India ship. The original ran aground off England on its first voyage.`,
  s:[`The museum is housed in the Navy storehouse of 1656. Sails, rope, cannons and supplies for the war fleet were kept here. The courtyard now has a glass roof patterned with compass roses and lines.`,`The real Amsterdam ran aground near Hastings on its maiden voyage in 1749. The wreck still lies there in the sand. The replica at the quay was built in the 1980s by volunteers and young people on a job scheme.`],
  tip:`Even without a ticket the quay is worth it: you see the ship up close.`}},

{id:'nemo',lat:52.3741,lng:4.9123,c:'grap',z:'oost',a:'Oosterdok 2',
 nl:{n:`Het dak van NEMO`,k:`Een groen gebouw als een scheepsboeg, met een gratis plein op het dak.`,
  s:[`NEMO is van architect Renzo Piano en opende in 1997. Het staat boven op de ingang van de IJtunnel, dus onder je voeten rijden de auto's de stad uit. De vorm lijkt op een schip dat de haven uit vaart.`,`Binnen is het een wetenschapsmuseum voor kinderen. Het dak is van iedereen: een schuin plein met trappen, een terras en een van de mooiste uitzichten over het oude centrum.`],
  tip:`De trap op de buitenkant is gratis. Ga bij zonsondergang.`},
 en:{n:`The roof of NEMO`,k:`A green building shaped like a ship's bow, with a free square on the roof.`,
  s:[`NEMO is by architect Renzo Piano and opened in 1997. It sits right on top of the entrance to the IJ tunnel, so cars drive out of town beneath your feet. The shape suggests a ship sailing out of the harbour.`,`Inside it is a science museum for children. The roof belongs to everyone: a sloping square with steps, a terrace and one of the best views over the old centre.`],
  tip:`The outside stairs are free. Go at sunset.`}},

{id:'artis',lat:52.3661,lng:4.9165,c:'verhaal',z:'oost',a:'Plantage Kerklaan 38–40',
 nl:{n:`Artis`,k:`De oudste dierentuin van Nederland heet naar een spreuk: de natuur is de leermeesteres van de kunst.`,
  s:[`Artis werd in 1838 opgericht als Natura Artis Magistra. Het was eerst een genootschap voor de gegoede burgerij, met dieren, maar ook met een bibliotheek, concerten en verzamelingen. Gewone Amsterdammers mochten er lange tijd alleen in september in, tegen een kleine prijs.`,`Daarom loopt er ook nu nog veel meer door Artis dan dieren: oude gebouwen, een aquarium uit 1882 en een planetarium. De poort aan de Plantage Kerklaan, met de gouden adelaars, is al een bezienswaardigheid.`],
  tip:`Rond Artis ligt de Plantage, een rustige buurt met brede lanen. Loop er gewoon doorheen.`},
 en:{n:`Artis Zoo`,k:`The oldest zoo in the Netherlands is named after a motto: nature is the teacher of art.`,
  s:[`Artis was founded in 1838 as Natura Artis Magistra. At first it was a society for the well-to-do, with animals but also a library, concerts and collections. For a long time ordinary Amsterdammers were only let in during September, for a small fee.`,`That is why there is still much more than animals: old buildings, an aquarium from 1882 and a planetarium. The gate on Plantage Kerklaan, with its golden eagles, is a sight in itself.`],
  tip:`Around Artis lies the Plantage, a quiet area of wide avenues. Just stroll through.`}},

{id:'amstelhof',lat:52.3653,lng:4.9026,c:'bouw',z:'oost',a:'Amstel 51',
 nl:{n:`Het Amstelhof`,k:`Een van de grootste gebouwen aan de Amstel was ruim driehonderd jaar een bejaardenhuis.`,
  s:[`Het Amstelhof werd eind zeventiende eeuw gebouwd door de diaconie, voor oude vrouwen en later ook oude mannen. Achter de strenge gevel liggen een binnenhof, een kerkzaal en een regentenkamer. Pas in 2007 vertrokken de laatste bewoners.`,`Daarna werd het de Hermitage Amsterdam, met kunst uit Sint-Petersburg. Na de Russische inval in Oekraïne in 2022 werd die band verbroken. Nu heet het museum H'ART.`],
  tip:`Loop langs de Amstel aan de overkant voor het overzicht van de hele gevel.`},
 en:{n:`The Amstelhof`,k:`One of the largest buildings on the Amstel was a home for the elderly for over three hundred years.`,
  s:[`The Amstelhof was built in the late seventeenth century by the church's charity, for old women and later old men too. Behind the austere front lie a courtyard, a chapel hall and a regents' room. The last residents only left in 2007.`,`It then became the Hermitage Amsterdam, showing art from St Petersburg. After Russia's invasion of Ukraine in 2022 that link was cut. Today the museum is called H'ART.`],
  tip:`Walk along the Amstel on the opposite bank to see the whole front.`}},

{id:'carre',lat:52.3623,lng:4.9040,c:'grap',z:'oost',a:'Amstel 115',
 nl:{n:`Carré, een circus van steen`,k:`Dit grote theater aan de Amstel werd gebouwd voor paarden en acrobaten.`,
  s:[`De Duitse circusdirecteur Oscar Carré trok met zijn circus rond en speelde eerst in tenten op het Amstelveld. In december 1887 opende hij hier een vast gebouw, alleen voor de wintermaanden. De rest van het jaar was het circus op tournee en stond het leeg.`,`Pas later werd het een theater voor alles: cabaret, musicals, concerten. Maar elk jaar rond kerst komt het circus nog terug, in een piste waar Oscar Carré zich thuis zou voelen.`],
  tip:`Mooi vanaf de Magere Brug, vooral als het donker is en de gevel verlicht.`},
 en:{n:`Carré, a circus in stone`,k:`This big theatre on the Amstel was built for horses and acrobats.`,
  s:[`German circus director Oscar Carré toured with his circus and first played in tents on the Amstelveld. In December 1887 he opened a permanent building here, only for the winter months. The rest of the year the circus was on tour and the building stood empty.`,`Only later did it become a theatre for everything: cabaret, musicals, concerts. But every year around Christmas the circus still comes back, to a ring where Oscar Carré would feel at home.`],
  tip:`Lovely from the Magere Brug, especially after dark with the front lit up.`}},

{id:'slavernij',lat:52.3605,lng:4.9205,c:'verhaal',z:'oost',a:'Oosterpark',
 nl:{n:`Nationaal Monument Slavernijverleden`,k:`In het Oosterpark staat een monument dat laat zien hoe mensen zich losbreken.`,
  s:[`Het monument van de Surinaamse kunstenaar Erwin de Vries werd in 2002 onthuld. Het bestaat uit drie delen, van mensen in ketenen tot een figuur die zich bevrijdt. Het herinnert aan de slavernij in de voormalige koloniën, waar Amsterdamse kooplieden rijk van werden.`,`Elk jaar op 1 juli is hier de herdenking en viering van Keti Koti, de dag van de afschaffing. Dan is het park vol muziek, eten en mensen in feestelijke kleding.`],
  tip:`Het Oosterpark zelf is een fijn, rustig park. Aan de rand zit de Dappermarkt.`},
 en:{n:`National Slavery Monument`,k:`In the Oosterpark stands a monument showing people breaking free.`,
  s:[`The monument by Surinamese artist Erwin de Vries was unveiled in 2002. It has three parts, from people in chains to a figure breaking loose. It recalls slavery in the former colonies, from which Amsterdam merchants grew rich.`,`Every year on 1 July this is where Keti Koti, the day of abolition, is remembered and celebrated. The park then fills with music, food and people in festive dress.`],
  tip:`The Oosterpark itself is a pleasant, quiet park. The Dappermarkt is at its edge.`}},

{id:'sarphati',lat:52.3540,lng:4.8965,c:'rust',z:'pijp',a:'Sarphatipark',
 nl:{n:`Sarphati, de dokter die de stad verbouwde`,k:`Een huisarts die een broodfabriek, een glazen paleis en een luxe hotel liet bouwen.`,
  s:[`Samuel Sarphati zag in zijn praktijk elke dag wat armoede en vuil deden. Hij begon daarom van alles: een handelsschool, een broodfabriek voor goedkoop brood en plannen voor een schonere stad. Hij wilde Amsterdam ook weer trots maken.`,`Daarvoor liet hij het Paleis voor Volksvlijt bouwen, een glazen tentoonstellingspaleis naar Londens voorbeeld. Het brandde in 1929 af. Ook het Amstel Hotel was zijn idee. In dit park staat zijn monument, met een fontein.`],
  tip:`Een rustig rondje na de drukte van de Albert Cuyp, één straat verderop.`},
 en:{n:`Sarphati, the doctor who rebuilt the city`,k:`A family doctor who got a bread factory, a glass palace and a luxury hotel built.`,
  s:[`Samuel Sarphati saw every day in his practice what poverty and dirt did to people. So he started all sorts of things: a trade school, a bread factory for cheap bread and plans for a cleaner city. He also wanted Amsterdam to be proud again.`,`To that end he had the Paleis voor Volksvlijt built, a glass exhibition palace after London's example. It burned down in 1929. The Amstel Hotel was his idea too. His monument, with a fountain, stands in this park.`],
  tip:`A quiet loop after the bustle of the Albert Cuyp, one street away.`}},

{id:'heineken',lat:52.3578,lng:4.8918,c:'eten',z:'pijp',a:'Stadhouderskade 78',
 nl:{n:`De oude Heineken-brouwerij`,k:`Hier werd tot 1988 echt bier gebrouwen, midden in de stad.`,
  s:[`Gerard Adriaan Heineken kocht in 1864 een brouwerij en bouwde later aan de rand van De Pijp een grote nieuwe. Paardenwagens met vaten reden van hier de stad in. In 1988 verhuisde het brouwen naar Zoeterwoude.`,`Het oude gebouw werd een bezoekerscentrum, de Heineken Experience. Ook als je niet naar binnen gaat, zie je aan de rode baksteen en de grote poort dat dit een fabriek was.`],
  tip:`Vlak erbij ligt de Albert Cuyp. Voor een biertje met minder reclame: de bruine cafés in De Pijp.`},
 en:{n:`The old Heineken brewery`,k:`Real beer was brewed here, in the middle of town, until 1988.`,
  s:[`Gerard Adriaan Heineken bought a brewery in 1864 and later built a big new one on the edge of De Pijp. Horse-drawn carts loaded with barrels drove into town from here. In 1988 brewing moved to Zoeterwoude.`,`The old building became a visitor centre, the Heineken Experience. Even without going in, the red brick and the big gate show you this was a factory.`],
  tip:`The Albert Cuyp is close by. For a beer with less branding: the brown cafés of De Pijp.`}},

{id:'manege',lat:52.3601,lng:4.8711,c:'rust',z:'museum',a:'Vondelstraat 140',
 nl:{n:`De Hollandsche Manege`,k:`Achter een gewone gevel aan de Vondelstraat ligt een paleisje voor paarden.`,
  s:[`De Hollandsche Manege bestaat sinds 1744 en is de oudste rijschool van Nederland. Het huidige gebouw is uit 1882 en is geïnspireerd op de Spaanse Rijschool in Wenen: een hoge hal met stucwerk, spiegels en een balkon.`,`Hier leerden rijke Amsterdammers en leden van het koningshuis paardrijden. Er wordt nog steeds elke dag gereden, en de paarden mogen geregeld naar buiten op een weitje in het Vondelpark.`],
  tip:`Vanuit het café boven kijk je de rijhal in. Zoek de paardenhoofden op de gevel.`},
 en:{n:`The Hollandsche Manege`,k:`Behind an ordinary front on Vondelstraat lies a little palace for horses.`,
  s:[`The Hollandsche Manege dates from 1744 and is the oldest riding school in the Netherlands. The present building is from 1882 and was inspired by the Spanish Riding School in Vienna: a tall hall with stucco, mirrors and a balcony.`,`Wealthy Amsterdammers and members of the royal family learned to ride here. Riding still goes on every day, and the horses regularly get out to a meadow in the Vondelpark.`],
  tip:`From the café upstairs you look into the riding hall. Look for the horse heads on the front.`}}
];

 {id:'hijs',nl:[`Een hijsbalk`,`De balk met haak boven in de gevel. De trappen zijn te smal, dus de bank gaat door het raam. Daarom hellen de gevels ook voorover: dan slaat de lading niet tegen de muur.`],en:[`A hoist beam`,`The beam with a hook at the top of the house front. The stairs are too narrow, so the sofa goes in through the window. That is also why the fronts lean forward: the load does not hit the wall.`]},
 {id:'xxx',nl:[`Drie kruisen`,`Op paaltjes, putdeksels en vuilnisbakken. Het zijn Andreaskruisen uit het stadswapen, al eeuwen oud. Met 18+ heeft het niets te maken, al komt het de souvenirverkoop goed uit.`],en:[`Three crosses`,`On bollards, manhole covers and bins. They are St Andrew's crosses from the city's coat of arms, centuries old. Nothing to do with adult content, though it does help souvenir sales.`]},
 {id:'paal',nl:[`Een Amsterdammertje`,`Het roodbruine paaltje dat auto's van de stoep houdt. De stad haalt ze langzaam weg, dus elk exemplaar is er een.`],en:[`An Amsterdammertje`,`The red-brown bollard that keeps cars off the pavement. The city is slowly removing them, so every one counts.`]},
 {id:'krul',nl:[`Een krul`,`Het groene ijzeren urinoir langs de gracht, in de vorm van een krul. Het ontwerp is van eind negentiende eeuw. Inkijk tot de knie, uitkijk over het water.`],en:[`A 'curl'`,`The green iron urinal beside the canal, shaped like a curl. The design dates from the late nineteenth century. Visible to the knee, with a view of the water.`]},
 {id:'steen',nl:[`Een gevelsteen`,`Een steen met een afbeelding in de gevel: een ossenkop, een schip, een schaar. Tot rond 1800 hadden huizen geen nummer. Je woonde 'in de Vergulde Ster'.`],en:[`A gable stone`,`A carved picture set in the house front: an ox head, a ship, a pair of scissors. Until about 1800 houses had no numbers. You lived 'at the Gilded Star'.`]},
 {id:'gevels',nl:[`Trap, klok en hals`,`De drie klassieke gevels. Trapgevel: treden. Klokgevel: de vorm van een kerkklok. Halsgevel: een smalle hals met krullen ernaast. Spot ze alle drie in één straat.`],en:[`Step, bell and neck`,`The three classic gables. Step gable: stairs. Bell gable: the outline of a church bell. Neck gable: a narrow neck with scrolls at the sides. Find all three in one street.`]},
 {id:'scheef',nl:[`Een scheef huis`,`De stad staat op houten palen in slappe veengrond. Zakt de grondwaterstand, dan rot het hout en gaat het huis hangen. Buren houden elkaar overeind.`],en:[`A crooked house`,`The city stands on wooden piles in soft peat. If the groundwater drops, the wood rots and the house starts to lean. Neighbours hold each other up.`]},
 {id:'boot',nl:[`Een woonboot met tuin`,`Er liggen er zo'n 2.500. De mooiste hebben een dakterras, een moestuin in bakken en een poes die over de loopplank patrouilleert.`],en:[`A houseboat with a garden`,`There are about 2,500 of them. The best have a roof terrace, a vegetable patch in tubs and a cat patrolling the gangplank.`]},
 {id:'reiger',nl:[`Een reiger die niet opzij gaat`,`Blauwe reigers hebben geleerd waar de viskraam staat en wanneer de markt opruimt. Ze staan op autodaken en kijken je aan alsof jij hier te gast bent.`],en:[`A heron that will not budge`,`Grey herons have learned where the fish stall is and when the market packs up. They stand on car roofs and look at you as if you are the visitor.`]},
 {id:'stolper',nl:[`Een Stolperstein`,`Een messing steentje in de stoep, voor de deur van iemand die in de oorlog is weggevoerd en vermoord. Naam, geboortejaar, plaats van overlijden. Je moet bukken om het te lezen. Dat is de bedoeling.`],en:[`A Stolperstein`,`A small brass plate in the pavement, at the door of someone deported and murdered in the war. Name, year of birth, place of death. You have to bow to read it. That is the idea.`]}
];

<script>/* Losse weetjes: geen foto, geen verhaal, gewoon iets om te weten. Blauwe i-rondjes op de kaart. */
const WEETJES=[
{id:'trompet',lat:52.3735,lng:4.8969,
 nl:{n:`De smalste straat`,t:`De Trompettersteeg is ongeveer een meter breed. Tegemoetkomers passen er net langs, als iedereen zijn buik inhoudt. De ramen in de steeg zijn dicht; nu hangt er geregeld street art.`},
 en:{n:`The narrowest street`,t:`Trompettersteeg is about a metre wide. People coming the other way just fit, if everyone breathes in. The windows in the alley have closed; these days there is often street art.`}},
{id:'beurs',lat:52.3746,lng:4.8963,
 nl:{n:`Beidt uw tijd`,t:`Op de klokken van de toren van de Beurs van Berlage staat 'Beidt uw tijd' en 'Duur uw uur'. Berlage was socialist en dacht dat de handel in aandelen niet lang zou duren. Hij zag zijn beurs al als volkspaleis.`},
 en:{n:`Bide your time`,t:`The clocks on the tower of the Beurs van Berlage read 'Beidt uw tijd' (bide your time) and 'Duur uw uur' (last your hour). Berlage was a socialist who expected share trading not to last. He already pictured his exchange as a people's palace.`}},
{id:'mandje',lat:52.3745,lng:4.9006,
 nl:{n:`Stropdassen aan het plafond`,t:`Café 't Mandje op de Zeedijk was vanaf 1927 van Bet van Beeren: openlijk lesbisch, motorrijder, en niet bang. Had een gast een grote mond, dan knipte ze zijn stropdas af en hing die aan het plafond. Er hingen er honderden.`},
 en:{n:`Ties on the ceiling`,t:`From 1927 Café 't Mandje on the Zeedijk belonged to Bet van Beeren: openly lesbian, a motorcyclist, and fearless. If a customer got mouthy, she cut off his tie and hung it from the ceiling. Hundreds hung there.`}},
{id:'hooy',lat:52.3722,lng:4.8996,
 nl:{n:`Kruiden sinds 1743`,t:`Jacob Hooy begon in 1743 met een kruidenkraam op de Nieuwmarkt. De winkel aan de Kloveniersburgwal heeft nog zijn achttiende-eeuwse interieur, met rijen laatjes en houten tonnen vol drop.`},
 en:{n:`Herbs since 1743`,t:`Jacob Hooy started out in 1743 with a herb stall on the Nieuwmarkt. The shop on Kloveniersburgwal still has its eighteenth-century interior, with rows of little drawers and wooden barrels of liquorice.`}},
{id:'bartolotti',lat:52.3741,lng:4.8870,
 nl:{n:`Een nieuwe naam voor een erfenis`,t:`Herengracht 170 werd gebouwd voor Willem van den Heuvel. Hij erfde een fortuin van een Italiaanse oom en noemde zichzelf voortaan Guillelmo Bartolotti. Kijk naar de gevel: die buigt mee met de bocht van de gracht.`},
 en:{n:`A new name for an inheritance`,t:`Herengracht 170 was built for Willem van den Heuvel. He inherited a fortune from an Italian uncle and from then on called himself Guillelmo Bartolotti. Look at the front: it curves along with the bend of the canal.`}},
{id:'montel',lat:52.3721,lng:4.9057,
 nl:{n:`Een kasteel dat er nooit kwam`,t:`De Montelbaanstoren was in 1516 een verdedigingstoren. De Spaanse hertog van Alva wilde er een kasteel omheen bouwen, Monte Albano. Dat kasteel kwam er nooit, de naam bleef: verbasterd tot Montelbaan.`},
 en:{n:`A castle that never came`,t:`The Montelbaanstoren was built in 1516 as a defence tower. The Spanish Duke of Alba wanted to build a castle round it, Monte Albano. The castle never happened; the name stuck, garbled into Montelbaan.`}},
{id:'schreier',lat:52.3767,lng:4.9024,
 nl:{n:`De huilende vrouwen`,t:`Volgens de legende namen vrouwen bij de Schreierstoren huilend afscheid van hun zeemannen. Waarschijnlijker komt de naam van 'schreye', een scherpe hoek in de stadsmuur. Een gedenksteen meldt dat Henry Hudson hier in 1609 vertrok, op de reis die hem naar Manhattan bracht.`},
 en:{n:`The weeping women`,t:`Legend says women wept farewell to their sailors at the Schreierstoren. More likely the name comes from 'schreye', a sharp corner in the city wall. A plaque records that Henry Hudson left from here in 1609, on the voyage that took him to Manhattan.`}},
{id:'waag',lat:52.3727,lng:4.9003,
 nl:{n:`Snijden onder het dak`,t:`De Waag op de Nieuwmarkt was eerst een stadspoort, daarna de plek waar goederen werden gewogen. Boven zat het chirurgijnsgilde, met een snijzaal: lichamen van geëxecuteerde misdadigers werden er in het openbaar ontleed, voor publiek dat entree betaalde.`},
 en:{n:`Dissection upstairs`,t:`The Waag on Nieuwmarkt began as a city gate, then became the place where goods were weighed. Upstairs was the surgeons' guild, with a dissection theatre: bodies of executed criminals were dissected in public, for an audience that paid to watch.`}},
{id:'kalver',lat:52.3710,lng:4.8917,
 nl:{n:`Kalveren in de Kalverstraat`,t:`De drukste winkelstraat van het land dankt zijn naam aan de veemarkt die hier vroeger werd gehouden. Waar nu de sneakers liggen, stonden toen de kalveren.`},
 en:{n:`Calves on Kalverstraat`,t:`The country's busiest shopping street is named after the cattle market once held here. Where the trainers are on display now, the calves once stood.`}},
{id:'dansend',lat:52.3755,lng:4.8968,
 nl:{n:`De dansende huizen`,t:`Kijk vanaf het Damrak naar de huizen aan het water. Ze hangen voorover, opzij en tegen elkaar aan, omdat hun houten palen in de slappe grond zijn gaan zakken. Amsterdammers noemen ze de dansende huizen.`},
 en:{n:`The dancing houses`,t:`From Damrak, look at the houses along the water. They lean forward, sideways and against each other because their wooden piles have sunk into the soft ground. Locals call them the dancing houses.`}},
{id:'hendricken',lat:52.3749,lng:4.8817,
 nl:{n:`Drie Hendricken`,t:`Op de Bloemgracht staan drie huizen met elk een gevelsteen: een stedeling, een boer en een zeeman. Ze heten de Drie Hendricken. De Bloemgracht werd vanwege de mooie gevels ook wel de Herengracht van de Jordaan genoemd.`},
 en:{n:`The Three Hendricks`,t:`On Bloemgracht three houses each carry a gable stone: a townsman, a farmer and a sailor. They are known as the Three Hendricks. For its fine fronts, Bloemgracht was nicknamed the Herengracht of the Jordaan.`}},
{id:'solder',lat:52.3752,lng:4.8994,
 nl:{n:`Een kerk op zolder`,t:`Achter de gevel van Oudezijds Voorburgwal 38–40 zit op de zolder een complete katholieke kerk, uit de tijd dat katholieken hun geloof niet openlijk mochten belijden. Met orgel, galerijen en een preekstoel die je kunt wegklappen. Nu is het museum Ons' Lieve Heer op Solder.`},
 en:{n:`A church in the attic`,t:`Behind the front of Oudezijds Voorburgwal 38–40, the attic holds a complete Catholic church, from the time when Catholics could not worship openly. With an organ, galleries and a pulpit that folds away. It is now the museum Our Lord in the Attic.`}},
{id:'munt',lat:52.3673,lng:4.8930,
 nl:{n:`Geld uit een toren`,t:`De Munttoren was eerst een stadspoort. In het rampjaar 1672, toen het land in oorlog was, werd hier tijdelijk geld geslagen. Vandaar de naam.`},
 en:{n:`Money from a tower`,t:`The Munttoren began as a city gate. In the disaster year 1672, with the country at war, coins were minted here for a while. Hence the name: mint tower.`}},
{id:'blauw',lat:52.3670,lng:4.9005,
 nl:{n:`Een blauwe brug die niet blauw is`,t:`De Blauwbrug over de Amstel is van steen en niet blauw. Hij dankt zijn naam aan de houten brug die hier eerder lag, en die wel blauw geverfd was.`},
 en:{n:`A blue bridge that isn't blue`,t:`The Blauwbrug over the Amstel is made of stone and is not blue. It is named after the wooden bridge that stood here earlier, which was painted blue.`}},
{id:'snoge',lat:52.3675,lng:4.9055,
 nl:{n:`Kaarsen en zand`,t:`De Portugese Synagoge uit 1675 heeft nooit elektrisch licht gekregen. Bij diensten branden honderden kaarsen. Op de houten vloer ligt zand, dat vocht en vuil opneemt en het geluid van voetstappen dempt.`},
 en:{n:`Candles and sand`,t:`The Portuguese Synagogue of 1675 never got electric light. Services are lit by hundreds of candles. Sand covers the wooden floor, soaking up damp and dirt and muffling footsteps.`}},
{id:'rembrandt',lat:52.3694,lng:4.9013,
 nl:{n:`Rembrandt kon de hypotheek niet betalen`,t:`Rembrandt kocht dit huis aan de Jodenbreestraat in 1639, op afbetaling. Hij betaalde het nooit af. Hij ging failliet en zijn huis en spullen werden geveild. Dankzij de lijst van de veiling weten we precies wat er in welke kamer stond.`},
 en:{n:`Rembrandt couldn't pay the mortgage`,t:`Rembrandt bought this house on Jodenbreestraat in 1639, on credit. He never paid it off. He went bankrupt and his house and belongings were auctioned. Thanks to the auction list we know exactly what stood in which room.`}},
{id:'kroning',lat:52.3742,lng:4.8913,
 nl:{n:`Een koning zonder kroon op`,t:`In de Nieuwe Kerk worden Nederlandse koningen ingehuldigd, niet gekroond. De kroon ligt naast de koning op een kussen en gaat nooit op zijn hoofd.`},
 en:{n:`A king who never wears the crown`,t:`Dutch monarchs are inaugurated in the Nieuwe Kerk, not crowned. The crown lies beside the king on a cushion and never goes on his head.`}},
{id:'monument',lat:52.3728,lng:4.8936,
 nl:{n:`Aarde uit het hele land`,t:`In de muur achter het Nationaal Monument op de Dam zitten urnen met aarde uit alle provincies en uit het voormalige Nederlands-Indië. Op 4 mei is dit de plek van de Nationale Herdenking.`},
 en:{n:`Soil from the whole country`,t:`The wall behind the National Monument on Dam Square holds urns with soil from every province and from the former Dutch East Indies. On 4 May this is where the national remembrance takes place.`}},
{id:'kolommen',lat:52.3650,lng:4.8939,
 nl:{n:`Waar de burgemeester woont`,t:`Herengracht 502, het Huis met de Kolommen, is de ambtswoning van de burgemeester van Amsterdam. Wie hier woont, heeft een van de mooiste adressen van de stad, voor zolang het ambt duurt.`},
 en:{n:`Where the mayor lives`,t:`Herengracht 502, the House with the Columns, is the official residence of the mayor of Amsterdam. Whoever lives here has one of the finest addresses in town, for as long as the job lasts.`}},
{id:'spiegel',lat:52.3628,lng:4.8868,
 nl:{n:`Antiek met uitzicht`,t:`De Spiegelstraat en Spiegelgracht zitten vol antiekwinkels en galeries. Loop richting het zuiden: de straat kijkt recht op het Rijksmuseum uit, als een etalage voor de echte schatkamer.`},
 en:{n:`Antiques with a view`,t:`Spiegelstraat and Spiegelgracht are full of antique shops and galleries. Walk south: the street looks straight at the Rijksmuseum, like a shop window for the real treasure house.`}},
{id:'tempel',lat:52.3737,lng:4.9005,
 nl:{n:`Een tempel op de Zeedijk`,t:`Midden op de Zeedijk staat een boeddhistische tempel in de stijl van een Chinees paleis, geopend in 2000. Je mag naar binnen. Op een paar meter van de rosse buurt is het er opvallend stil.`},
 en:{n:`A temple on the Zeedijk`,t:`In the middle of the Zeedijk stands a Buddhist temple in the style of a Chinese palace, opened in 2000. Visitors may go in. A few metres from the red-light district, it is remarkably quiet.`}},
{id:'metro',lat:52.3725,lng:4.9010,
 nl:{n:`Gevochten om een metro`,t:`Voor de aanleg van de metro werden rond de Nieuwmarkt hele huizenblokken gesloopt. In 1975 kwam het tot zware rellen tussen bewoners en de ME. In het metrostation herinneren kunstwerken aan die strijd. De bewoners verloren de metro, maar wonnen de buurt: er kwam geen snelweg.`},
 en:{n:`A fight over a metro`,t:`To build the metro, whole blocks round Nieuwmarkt were torn down. In 1975 it came to heavy riots between residents and riot police. Artworks in the metro station recall the struggle. Residents lost the metro fight but won the neighbourhood: the planned motorway never came.`}},
{id:'dam',lat:52.3730,lng:4.8925,
 nl:{n:`Een dam in de Amstel`,t:`Rond 1270 legden bewoners hier een dam in de Amstel, tegen het water van het IJ. De nederzetting heette Amstelredam. Je staat dus letterlijk op het ding waar de stad naar heet.`},
 en:{n:`A dam in the Amstel`,t:`Around 1270 locals built a dam across the Amstel here, to keep out the water of the IJ. The settlement was called Amstelredam. So you are standing on the very thing the city is named after.`}},
{id:'hoppe',lat:52.3688,lng:4.8898,
 nl:{n:`Een van de oudste cafés`,t:`Café Hoppe op het Spui schenkt al sinds 1670. Binnen is het donker, bruin en klein, en buiten staat op mooie dagen half het Spui met een biertje in de hand.`},
 en:{n:`One of the oldest bars`,t:`Café Hoppe on Spui has been pouring since 1670. Inside it is dark, brown and small, and on fine days half of Spui stands outside with a beer in hand.`}},
{id:'oba',out:1,lat:52.3758,lng:4.9080,
 nl:{n:`Gratis uitzicht in de bibliotheek`,t:`De Centrale Bibliotheek op het Oosterdokseiland heeft op de bovenste verdieping een restaurant met terras. Iedereen mag naar boven en het uitzicht over de oude stad kost niets.`},
 en:{n:`A free view in the library`,t:`The Central Library on Oosterdokseiland has a restaurant with a terrace on its top floor. Anyone can go up, and the view over the old city costs nothing.`}},
{id:'entrepot',out:1,lat:52.3685,lng:4.9140,
 nl:{n:`Belastingvrije pakhuizen`,t:`Langs het Entrepotdok staat een lange rij pakhuizen. Wie hier goederen opsloeg, betaalde pas belasting als die de stad in gingen. Nu wonen er mensen, en aan de kade liggen woonboten met tuintjes.`},
 en:{n:`Tax-free warehouses`,t:`A long row of warehouses lines the Entrepotdok. Goods stored here were only taxed once they went into town. People live there now, and houseboats with little gardens line the quay.`}},
{id:'wertheim',out:1,lat:52.3664,lng:4.9085,
 nl:{n:`Gebroken spiegels`,t:`In het Wertheimpark ligt het Auschwitzmonument van Jan Wolkers: gebroken spiegels in de grond, met erboven de tekst 'Nooit meer Auschwitz'. De lucht die erin weerspiegelt, is altijd gebroken.`},
 en:{n:`Broken mirrors`,t:`In Wertheimpark lies Jan Wolkers' Auschwitz memorial: broken mirrors set in the ground, with the words 'Never again Auschwitz' above. The sky reflected in them is always broken.`}},
{id:'vondelbunker',out:1,lat:52.3606,lng:4.8752,
 nl:{n:`Een atoombunker onder het park`,t:`Onder een brug in het Vondelpark zit een schuilkelder uit 1947, bedoeld tegen atoombommen. Sinds 2011 is het een cultuurplek van vrijwilligers, met bandjes, films en debatten.`},
 en:{n:`A nuclear bunker under the park`,t:`Under a bridge in the Vondelpark is a 1947 shelter meant to survive atomic bombs. Since 2011 it has been a volunteer-run cultural space, with bands, films and debates.`}},
{id:'parkieten',out:1,lat:52.3575,lng:4.8660,
 nl:{n:`Groene papegaaien`,t:`Hoor je in het Vondelpark hard gekrijs uit de bomen? Dat zijn halsbandparkieten: felgroene vogels, ooit ontsnapte huisdieren, die het hier prima naar hun zin hebben.`},
 en:{n:`Green parrots`,t:`Hear loud screeching from the trees in the Vondelpark? Those are ring-necked parakeets: bright green birds, once escaped pets, that are doing very nicely here.`}},
{id:'vondel',out:1,lat:52.3610,lng:4.8790,
 nl:{n:`Een park met een andere naam`,t:`Het Vondelpark opende in 1865 als het Nieuwe Park. Twee jaar later kwam het beeld van dichter Joost van den Vondel erin, en daarna kreeg het park zijn naam.`},
 en:{n:`A park with another name`,t:`The Vondelpark opened in 1865 as the New Park. Two years later the statue of the poet Joost van den Vondel arrived, and the park took his name.`}},
{id:'letters',out:1,lat:52.3585,lng:4.8825,
 nl:{n:`Waar de letters stonden`,t:`Hier stonden jarenlang de rood-witte letters I amsterdam, met de hele dag mensen erop voor een selfie. Op 3 december 2018 haalde de gemeente ze weg: ze trokken te veel drukte.`},
 en:{n:`Where the letters stood`,t:`For years the red-and-white I amsterdam letters stood here, covered in people taking selfies all day. On 3 December 2018 the city removed them: they drew too much of a crowd.`}},
{id:'ah',out:1,lat:52.3577,lng:4.8832,
 nl:{n:`Een supermarkt onder het gras`,t:`Op het Museumplein is een hoek van het grasveld schuin omhoog geklapt. Daaronder zit een supermarkt. Handig voor een picknick met uitzicht op het Rijksmuseum.`},
 en:{n:`A supermarket under the grass`,t:`On Museumplein one corner of the lawn is tilted up like a lid. Underneath is a supermarket. Handy for a picnic with a view of the Rijksmuseum.`}},
{id:'rijkstuin',out:1,lat:52.3595,lng:4.8838,
 nl:{n:`De tuin van het Rijksmuseum`,t:`Rond het Rijksmuseum ligt een tuin met fonteinen, rozen en losse bouwfragmenten van oude Nederlandse gebouwen. Hij is gratis en bijna altijd rustig.`},
 en:{n:`The Rijksmuseum garden`,t:`Around the Rijksmuseum lies a garden with fountains, roses and stray fragments of old Dutch buildings. It is free and nearly always quiet.`}},
{id:'concertgebouw',out:1,lat:52.3563,lng:4.8792,
 nl:{n:`Een concertzaal in de wei`,t:`Het Concertgebouw opende in 1888 aan de rand van de stad, waar toen nog weilanden lagen. Nu staat het midden in Zuid. Op woensdag tussen de middag is er vaak een gratis lunchconcert.`},
 en:{n:`A concert hall in a meadow`,t:`The Concertgebouw opened in 1888 at the edge of town, where there were still fields. Now it sits in the middle of Zuid. On Wednesday lunchtimes there is often a free concert.`}},
{id:'paradiso',out:1,lat:52.3622,lng:4.8840,
 nl:{n:`Een kerk vol popmuziek`,t:`Paradiso was een kerk van een vrijzinnige gemeente. Sinds eind jaren zestig is het een poppodium, en het wordt nog altijd de poptempel genoemd. Onder de kerkramen hebben de grootste bands gespeeld.`},
 en:{n:`A church full of pop music`,t:`Paradiso was the church of a liberal congregation. Since the late 1960s it has been a music venue, still nicknamed the pop temple. The biggest bands have played beneath its church windows.`}},
{id:'melkweg',out:1,lat:52.3648,lng:4.8810,
 nl:{n:`Een melkfabriek`,t:`De Melkweg was vroeger een melkfabriek. Sinds 1970 is het een podium voor muziek, film en kunst. De naam is een woordgrap op de melk en op de sterren.`},
 en:{n:`A dairy`,t:`The Melkweg used to be a dairy. Since 1970 it has been a venue for music, film and art. The name is a pun: melkweg means both milk way and Milky Way.`}},
{id:'haarlemmerpoort',out:1,lat:52.3840,lng:4.8803,
 nl:{n:`Een poort voor een koning`,t:`De Haarlemmerpoort werd in 1840 gebouwd als Willemspoort, voor de intocht van koning Willem II. Een stadspoort was toen eigenlijk al niet meer nodig; het was vooral een welkomstgebaar.`},
 en:{n:`A gate for a king`,t:`The Haarlemmerpoort was built in 1840 as the William Gate, for the entry of King William II. By then the city hardly needed a gate; it was mostly a gesture of welcome.`}},

  if(WORLD){ if(V.s>=.3) roadLabels(WORLD.labels.filter(r=>r.w>=(V.s>=.6?2:3))); }
  else { if(V.s>=.14) roadLabels(DR.labels.filter(r=>V.s>=.3||r.w>2),.7);
    cx.font='600 12px '+FONT; cx.textAlign='center'; cx.fillStyle=COL.muted; AREAS.forEach(a=>{ const X=sx(mX(a[2])),Y=sy(mY(a[1])); if(X>0&&Y>0&&X<cw&&Y<ch) halo(a[0].toUpperCase(),X,Y); }); }
  const vis=visible();
  if(filter==='mine'&&S.mine.length>1){ const ids=ordered(S.mine); cx.beginPath(); ids.forEach((id,i)=>{ const p=P(id),X=sx(mX(p.lng)),Y=sy(mY(p.lat)); i?cx.lineTo(X,Y):cx.moveTo(X,Y); });
    cx.strokeStyle=COL.accent; cx.globalAlpha=.7; cx.lineWidth=2; cx.setLineDash([2,7]); cx.stroke(); cx.setLineDash([]); cx.globalAlpha=1; }
  const r=Math.max(9,Math.min(14,9+V.s*14));
  visW().forEach(w=>{ const X=sx(mX(w.lng)),Y=sy(mY(w.lat)); if(X<-20||Y<-20||X>cw+20||Y>ch+20) return; const on='w:'+w.id===sel, rr=on?10:7.5;
    cx.beginPath(); cx.arc(X,Y,rr,0,7); cx.fillStyle=on?COL.accent:COL.card; cx.fill(); cx.strokeStyle=COL.accent; cx.lineWidth=1.8; cx.stroke();
    cx.font='italic 700 '+(on?13:11)+'px Georgia,serif'; cx.textAlign='center'; cx.fillStyle=on?'#fff':COL.accent; cx.fillText('i',X,Y+(on?4.5:4)); });
  vis.filter(p=>p.id!==sel).sort((a,b)=>a.lat<b.lat?1:-1).forEach(p=>pin(p,r));
  if(sel&&!W_(sel)){ const p=P(sel); pin(p,r+4,true); const X=sx(mX(p.lng)),Y=sy(mY(p.lat)); cx.font='600 13px '+FONT; cx.textAlign='center'; cx.fillStyle=COL.ink; const hw=cx.measureText(tx(p).n).width/2+6; halo(tx(p).n,Math.max(hw,Math.min(cw-hw,X)),Y+r+19); }
  if(pos){ const X=sx(mX(pos.lng)),Y=sy(mY(pos.lat)); if(pos.acc>12){ cx.beginPath(); cx.arc(X,Y,Math.min(160,pos.acc*V.s),0,7); cx.fillStyle='rgba(30,110,220,.14)'; cx.fill(); }
    cx.beginPath(); cx.arc(X,Y,7,0,7); cx.fillStyle='#1e6edc'; cx.fill(); cx.strokeStyle='#fff'; cx.lineWidth=2.5; cx.stroke(); }
  cx.font='10px '+FONT; cx.textAlign='right'; cx.fillStyle=COL.muted; cx.fillText(WORLD?MW.Tiles.attr:worldState==='loading'?L().loading:L().drawn,cw-8,ch-6); }
const redraw=()=>{ if(!raf) raf=requestAnimationFrame(draw); };
function zoomAt(f,px,py){ const wx=(px-cw/2)/V.s+V.x, wy=(py-ch/2)/V.s+V.y; V.s=Math.max(.06,Math.min(4,V.s*f)); V.x=wx-(px-cw/2)/V.s; V.y=wy-(py-ch/2)/V.s; redraw(); }
function centerOn(p,minS){ V.x=mX(p.lng); V.y=mY(p.lat); if(minS&&V.s<minS) V.s=minS; redraw(); }
(function(){ const pt=new Map(); let moved=0, pd=0;
  const loc=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  cv.addEventListener('pointerdown',e=>{ try{cv.setPointerCapture(e.pointerId);}catch(_){ } pt.set(e.pointerId,loc(e)); moved=0; if(pt.size===2){ const a=[...pt.values()]; pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]); } });
  cv.addEventListener('pointermove',e=>{ if(!pt.has(e.pointerId)) return; const o=pt.get(e.pointerId), n=loc(e); pt.set(e.pointerId,n);
    if(pt.size===1){ V.x-=(n[0]-o[0])/V.s; V.y-=(n[1]-o[1])/V.s; moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]); redraw(); }
    else if(pt.size===2){ const a=[...pt.values()], d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]); if(pd) zoomAt(d/pd,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2); pd=d; moved=99; } });
  const up=e=>{ if(!pt.has(e.pointerId)) return; const n=pt.get(e.pointerId); pt.delete(e.pointerId); pd=0; if(moved<8&&e.type==='pointerup') tap(n[0],n[1]); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const n=loc(e); zoomAt(e.deltaY<0?1.2:1/1.2,n[0],n[1]); },{passive:false}); })();
function tap(x,y){
  if(moveId){ const p=P(moveId); p.lng=+(ORG.lon+((x-cw/2)/V.s+V.x)/KX).toFixed(5); p.lat=+(ORG.lat-((y-ch/2)/V.s+V.y)/KY).toFixed(5);
    try{ const o=JSON.parse(localStorage.getItem(PINKEY))||{}; o[p.id]=[p.lat,p.lng]; localStorage.setItem(PINKEY,JSON.stringify(o)); }catch(e){} moveId=null; toast(L().moved); redraw(); return; }
  let best=null,bd=26; visible().forEach(p=>{ const d=Math.hypot(sx(mX(p.lng))-x,sy(mY(p.lat))-y); if(d<bd){bd=d;best=p.id;} });
  visW().forEach(w=>{ const d=Math.hypot(sx(mX(w.lng))-x,sy(mY(w.lat))-y)+4; if(d<bd){bd=d;best='w:'+w.id;} });
  sel=best; if(S.intro){ S.intro=0; save(); } renderCard(); redraw(); }
box.querySelector('.mapbtns').addEventListener('click',e=>{ const z=e.target.dataset.z; if(!z) return;
  if(z==='in') zoomAt(1.4,cw/2,ch/2); else if(z==='out') zoomAt(1/1.4,cw/2,ch/2); else if(z==='fit'){ const pts=visible().concat(visW()); fit(pts.length?pts:areaPlaces(),34); redraw(); } else gps(); });
new ResizeObserver(()=>{ size(); redraw(); }).observe(box);

/* ---------- locatie ---------- */
function mapMsg(t){ const e=$('#mapmsg'); e.textContent=t||''; e.style.display=t?'block':'none'; }
function gps(){ const b=box.querySelector('[data-z=me]');
  if(gpsOn){ if(pos&&inTown()) centerOn(pos,.9); else if(pos) mapMsg(L().gpsFar(Math.round(dist(pos,{lat:ORG.lat,lng:ORG.lon})/1000))); return; }
  if(!navigator.geolocation){ mapMsg(L().gpsOff); return; } gpsOn=true; b.classList.add('act'); mapMsg(L().gpsSeek); let first=true;
  try{ gpsId=navigator.geolocation.watchPosition(g=>{ pos={lat:g.coords.latitude,lng:g.coords.longitude,acc:g.coords.accuracy||0};
      if(inTown()){ mapMsg(''); if(first) centerOn(pos,.9); } else mapMsg(L().gpsFar(Math.round(dist(pos,{lat:ORG.lat,lng:ORG.lon})/1000))); first=false; arrive(); redraw(); if(view==='list') renderList(); else renderCard(); },
    err=>{ if(err.code===1||!pos){ gpsOn=false; b.classList.remove('act'); try{navigator.geolocation.clearWatch(gpsId);}catch(_){ } mapMsg(L().gpsOff); setTimeout(()=>mapMsg(''),5000); } },
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }catch(e){ gpsOn=false; b.classList.remove('act'); mapMsg(L().gpsOff); } }
function arrive(){ if(!pos||pos.acc>80||$('#sheet').classList.contains('on')) return; let best=null,bd=40; areaPlaces().forEach(p=>{ const d=dist(pos,p); if(d<bd&&!said[p.id]&&!S.seen[p.id]){bd=d;best=p;} });
  if(best){ said[best.id]=1; sel=best.id; try{ navigator.vibrate&&navigator.vibrate(120); }catch(e){} toast(L().youAt(tx(best).n)); renderCard(); } }

/* ---------- schermen ---------- */
function renderHead(){ document.documentElement.lang=S.lang; $('#sub').textContent=L().sub; $('#lang').textContent=S.lang==='nl'?'English':'Nederlands';
  $('#count').textContent=L().seenOf(areaPlaces().filter(p=>S.seen[p.id]).length,areaPlaces().length); $('#sheetBack').textContent=L().back;
  $('#chips').innerHTML='<button class="chip txt" data-f="all" aria-pressed="'+(filter==='all')+'">'+L().all+'</button>'+
    '<button class="chip txt" data-f="mine" aria-pressed="'+(filter==='mine')+'">'+L().mine+' · '+S.mine.length+'</button>'+
    '<button class="chip" data-f="weetje" aria-pressed="'+(filter==='weetje')+'"><span class="dot" style="background:var(--card);border:1.8px solid var(--accent);color:var(--accent);font:italic 700 12px Georgia,serif">i</span>'+L().weetjes+' · '+WEETJES.filter(w=>S.area==='all'||!w.out).length+'</button>'+
    CATS.map(c=>'<button class="chip" data-f="'+c+'" aria-pressed="'+(filter===c)+'">'+dotHTML(c)+L().cat[c]+'</button>').join('');
  $('#tabs').innerHTML=[['map',L().tabMap],['list',L().tabList],['tips',L().tabTips]].map(t=>'<button role="tab" data-v="'+t[0]+'" aria-selected="'+(view===t[0])+'">'+t[1]+'</button>').join('');
  [['in','Zoom in'],['out','Zoom out'],['fit',S.lang==='nl'?'Alles tonen':'Show all'],['me',S.lang==='nl'?'Mijn locatie':'My location']].forEach(a=>box.querySelector('[data-z='+a[0]+']').setAttribute('aria-label',a[1])); }
function dTxt(p){ return inTown()?L().away(dist(pos,p)):''; }
function renderCard(){ const c=$('#card');
  if(!sel){ c.innerHTML=S.intro?(ART?'<img class="hero" src="img/hero.webp" alt="">':'')+'<h2>'+L().introH(areaPlaces().length)+'</h2><p>'+L().introP+'</p><div class="row"><button class="btn pri" data-a="surprise">'+L().surprise+'</button><button class="btn" data-a="tips">'+L().pickList+'</button></div>'
      :'<div class="row"><button class="btn pri" data-a="surprise">'+L().surprise+'</button><button class="btn" data-a="tips">'+L().pickList+'</button><span class="dist">'+visible().length+' '+L().tabList.toLowerCase()+'</span></div>'; return; }
  const w=W_(sel); if(w){ const near=visW().filter(x=>x!==w).sort((a,b)=>dist(w,a)-dist(w,b))[0];
    c.innerHTML='<div class="kick"><span class="dot" style="background:var(--accent);color:#fff;font:italic 700 12px Georgia,serif">i</span>'+L().weetje+'<span class="dist">'+dTxt(w)+'</span></div><h2>'+esc(w[S.lang].n)+'</h2><p>'+esc(w[S.lang].t)+'</p>'+
      '<div class="row"><button class="btn" data-w="'+near.id+'">'+L().nextW+' →</button><a class="btn quiet" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+w.lat+','+w.lng+'">'+L().maps+' ↗</a></div>'; return; }
  const p=P(sel), t=tx(p), mine=S.mine.includes(p.id);
  c.innerHTML='<div class="kick">'+dotHTML(p.c)+L().cat[p.c]+(p.t?'<span class="tag">'+L().busy+'</span>':'')+'<span class="dist">'+dTxt(p)+'</span></div><h2>'+esc(t.n)+'</h2><p>'+esc(t.k)+'</p>'+
    '<div class="row"><button class="btn pri" data-a="read">'+L().read+'</button><button class="btn'+(mine?' on':'')+'" data-a="mine">'+(mine?L().added:L().add)+'</button></div>'; }
function renderList(){ const vis=visible(), row=p=>'<button class="item'+(S.seen[p.id]?' seen':'')+'" data-id="'+p.id+'">'+dotHTML(p.c)+'<span><b>'+esc(tx(p).n)+'</b><span class="k">'+esc(tx(p).k)+'</span></span><span class="meta">'+dTxt(p)+(p.t?'<br>'+L().busy:'')+'</span></button>';
  let h=''; if(inTown()) h+='<div class="row" style="margin:6px 0 4px"><button class="pill" data-a="sort">'+(sortNear?L().sortZone:L().sortNear)+'</button></div>';
  if(filter==='weetje'){ $('#list').innerHTML='<h3>'+L().weetjes+'</h3>'+visW().slice().sort((a,b)=>inTown()?dist(pos,a)-dist(pos,b):0).map(w=>'<button class="item" data-w="'+w.id+'"><span class="dot" style="background:var(--card);border:1.8px solid var(--accent);color:var(--accent);font:italic 700 14px Georgia,serif">i</span><span><b>'+esc(w[S.lang].n)+'</b><span class="k">'+esc(w[S.lang].t)+'</span></span><span class="meta">'+dTxt(w)+'</span></button>').join(''); return; }
  if(filter==='mine'&&!vis.length) h+='<p class="small" style="margin-top:14px">'+L().mineEmpty+'</p>';
  if(sortNear&&inTown()) h+='<h3>'+L().sortNear+'</h3>'+vis.slice().sort((a,b)=>dist(pos,a)-dist(pos,b)).map(row).join('');
  else if(filter==='mine') h+='<h3>'+L().mine+'</h3>'+ordered(S.mine).map(id=>row(P(id))).join('');
  else ZONES.forEach(z=>{ const a=vis.filter(p=>p.z===z); if(a.length) h+='<h3>'+L().z[z]+'</h3>'+a.map(row).join(''); });
  $('#list').innerHTML=h; }
function renderTips(){ const m=ordered(S.mine); let h='<h3>'+L().areaH+'</h3><div class="box"><p>'+L().areaP+'</p><div class="row"><button class="btn'+(S.area!=='all'?' on':'')+'" data-area="in">'+L().areaIn+'</button><button class="btn'+(S.area==='all'?' on':'')+'" data-area="all">'+L().areaAll+'</button></div></div>';
  h+='<h3>'+L().mine+'</h3><div class="box">';
  if(m.length){ const km=walkKm(m); h+='<p>'+L().mineSum(m.length,kmTxt(km),L().hours(km/4.5+m.length*6/60))+'</p><div class="row"><button class="btn pri" data-a="showmine">'+L().showMine+'</button><button class="btn quiet" data-a="clear">'+L().clear+'</button></div>'; }
  else h+='<h4>'+L().ownH+'</h4><p style="margin:0">'+L().ownP+'</p>';
  h+='</div><h3>'+L().ready+'</h3>'+SETS.map(s=>{ const ids=ordered(s.ids); return '<div class="box">'+(ART&&SETART[s.id]?'<img class="set" src="img/set-'+s.id+'.webp" alt="" loading="lazy">':'')+'<h4>'+esc(s[S.lang].n)+'</h4><p>'+esc(s[S.lang].d)+'<br><span class="small">'+L().setMeta(ids.length,kmTxt(walkKm(ids)))+'</span></p><button class="btn" data-set="'+s.id+'">'+L().take+'</button></div>'; }).join('');
  const n=SPOT.filter(s=>S.spot[s.id]).length;
  h+='<h3>'+L().spotH+' · '+L().spotN(n,SPOT.length)+'</h3><div class="box"><p>'+L().spotP+'</p>'+SPOT.map(s=>'<div class="spot"><input type="checkbox" id="sp-'+s.id+'" data-spot="'+s.id+'"'+(S.spot[s.id]?' checked':'')+'>'+(ART?'<img src="img/spot-'+s.id+'.webp" alt="" loading="lazy">':'')+'<label for="sp-'+s.id+'"><b>'+esc(s[S.lang][0])+'</b><span>'+esc(s[S.lang][1])+'</span></label></div>').join('')+'</div>';
  h+='<h3>'+L().aboutH+'</h3><div class="box"><p>'+L().aboutP+'</p><button class="btn quiet" data-a="reset">'+L().reset+'</button></div>';
  if(CREDITS.length) h+='<h3>'+L().credH+'</h3><div class="box"><p>'+L().credP+'</p>'+CREDITS.map(c=>'<p class="small" style="margin:0 0 6px">'+esc(tx(P(c.id)).n)+': <a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.maker)+'</a>, '+esc(c.lic)+'</p>').join('')+'</div>';
  if(test){ let pp='{}'; try{ pp=localStorage.getItem(PINKEY)||'{}'; }catch(e){} h+='<h3>'+L().pins+'</h3><pre>'+esc(pp)+'</pre>'; }
  $('#tips').innerHTML=h; }
function openStory(id){ const p=P(id), t=tx(p), mine=S.mine.includes(id), seen=S.seen[id]; sel=id;
  const near=PLACES.filter(q=>q.id!==id).sort((a,b)=>dist(p,a)-dist(p,b)).slice(0,3);
  $('#sheetPos').textContent=L().z[p.z];
  const cr=CREDITS.find(c=>c.id===id);
  $('#sheetIn').innerHTML=(IMG[id]?'<img class="ph" src="img/'+id+'.webp" alt="">'+(ILLUS[id]?'<p class="cred">'+L().illus+'</p>':cr?'<p class="cred">'+L().photo+': '+esc(cr.maker)+', '+esc(cr.lic)+'</p>':''):'')+'<div class="kick" style="margin-top:6px">'+dotHTML(p.c)+L().cat[p.c]+(p.t?'<span class="tag">'+L().busy+'</span>':'')+'</div><h2>'+esc(t.n)+'</h2><p class="addr">'+esc(p.a)+(dTxt(p)?' · '+dTxt(p):'')+'</p>'+
    '<p class="pull" style="--cc:var(--c-'+p.c+')">'+esc(t.k)+'</p><div class="story">'+t.s.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div><div class="tip"><b>'+L().tip+'</b>'+esc(t.tip)+'</div>'+
    '<div class="row"><button class="btn'+(seen?' on':' pri')+'" data-a="seen">'+(seen?L().beenOn:L().been)+'</button><button class="btn'+(mine?' on':'')+'" data-a="mine">'+(mine?L().added:L().add)+'</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn quiet" data-a="onmap">'+L().onMap+'</button><a class="btn quiet" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng+'">'+L().maps+' ↗</a>'+(test?'<button class="btn quiet" data-a="move">'+L().move+'</button>':'')+'</div>'+
    '<h3>'+L().near+'</h3>'+near.map(q=>'<button class="item" data-id="'+q.id+'">'+dotHTML(q.c)+'<span><b>'+esc(tx(q).n)+'</b><span class="k">'+esc(tx(q).k)+'</span></span><span class="meta">'+L().away(dist(p,q))+'</span></button>').join('');
  $('#sheet').classList.add('on'); $('#sheetIn').scrollTop=0; $('#sheetBack').focus(); }
function closeStory(){ $('#sheet').classList.remove('on'); renderAll(); }
function setView(v){ view=v; ['Map','List','Tips'].forEach(n=>$('#v'+n).classList.toggle('on',n.toLowerCase()===v)); renderAll(); if(v==='map'){ size(); redraw(); } }
function renderAll(){ renderHead(); renderCard(); if(view==='list') renderList(); if(view==='tips') renderTips(); redraw(); }
function setArea(a){ if(S.area===a) return; S.area=a; save(); WORLD=null; worldState='idle'; loadWorld(); if(sel&&!W_(sel)&&!inArea(P(sel))) sel=null; fit(areaPlaces(),34); renderAll(); }
function toggleMine(id){ const i=S.mine.indexOf(id); i<0?S.mine.push(id):S.mine.splice(i,1); save(); }
function surprise(){ const pool=areaPlaces().filter(p=>!S.seen[p.id]&&p.id!==sel); if(!pool.length){ toast(L().noSurprise); return; }
  const near=inTown()?pool.slice().sort((a,b)=>dist(pos,a)-dist(pos,b)).slice(0,8):pool; const p=near[Math.floor(Math.random()*near.length)];
  filter='all'; sel=p.id; S.intro=0; save(); renderAll(); centerOn(p,.7); }

/* ---------- bediening ---------- */
let brandTaps=0, brandT=0;
$('#brand').onclick=()=>{ clearTimeout(brandT); brandT=setTimeout(()=>brandTaps=0,1500); if(++brandTaps>=5){ brandTaps=0; test=!test; toast(test?L().testOn:L().testOff); renderAll(); } };
$('#lang').onclick=()=>{ S.lang=S.lang==='nl'?'en':'nl'; save(); renderAll(); if($('#sheet').classList.contains('on')) openStory(sel); };
$('#chips').onclick=e=>{ const b=e.target.closest('[data-f]'); if(!b) return; filter=b.dataset.f; if(sel&&!visible().some(p=>p.id===sel)) sel=null; renderAll(); const pts=visible().concat(visW()); if(view==='map'&&pts.length){ fit(pts,40); redraw(); } };
$('#tabs').onclick=e=>{ const b=e.target.closest('[data-v]'); if(b) setView(b.dataset.v); };
$('#sheetBack').onclick=closeStory;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#sheet').classList.contains('on')) closeStory(); });
document.addEventListener('click',e=>{ const it=e.target.closest('.item[data-id]'); if(it){ openStory(it.dataset.id); return; }
  const ar=e.target.closest('[data-area]'); if(ar){ setArea(ar.dataset.area); renderTips(); toast(S.area==='all'?L().areaSetAll:L().areaSetIn); return; }
  const wb=e.target.closest('[data-w]'); if(wb){ sel='w:'+wb.dataset.w; S.intro=0; save(); if(view!=='map') setView('map'); else renderAll(); centerOn(W_(sel),.7); return; }
  const st=e.target.closest('[data-set]'); if(st){ if(SETS.find(s=>s.id===st.dataset.set).ids.some(i=>!INNER.includes(P(i).z))&&S.area!=='all') setArea('all'); S.mine=SETS.find(s=>s.id===st.dataset.set).ids.slice(); S.intro=0; save(); filter='mine'; sel=null; setView('map'); fit(visible(),40); redraw(); toast(L().taken); return; }
  const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
  if(a==='surprise') surprise(); else if(a==='tips') setView('tips'); else if(a==='read') openStory(sel);
  else if(a==='mine'){ toggleMine(sel); if($('#sheet').classList.contains('on')) openStory(sel); else renderAll(); }
  else if(a==='seen'){ S.seen[sel]?delete S.seen[sel]:S.seen[sel]=1; save(); openStory(sel); renderHead(); }
  else if(a==='onmap'){ $('#sheet').classList.remove('on'); if(!visible().some(p=>p.id===sel)) filter='all'; setView('map'); centerOn(P(sel),.9); }
  else if(a==='move'){ moveId=sel; $('#sheet').classList.remove('on'); setView('map'); toast(L().moveGo); }
  else if(a==='sort'){ sortNear=!sortNear; renderList(); }
  else if(a==='showmine'){ filter='mine'; sel=null; setView('map'); fit(visible(),40); redraw(); }
  else if(a==='clear'){ S.mine=[]; save(); if(filter==='mine') filter='all'; renderAll(); }
  else if(a==='reset'){ if(b.dataset.sure){ S.seen={}; S.mine=[]; S.spot={}; S.intro=1; save(); filter='all'; sel=null; renderAll(); toast(L().resetDone); } else { b.dataset.sure=1; b.textContent=L().reset2; } } });
document.addEventListener('change',e=>{ const s=e.target.dataset&&e.target.dataset.spot; if(s){ e.target.checked?S.spot[s]=1:delete S.spot[s]; save(); renderTips(); } });
colors(); renderAll(); loadWorld();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(redraw);
</script>
